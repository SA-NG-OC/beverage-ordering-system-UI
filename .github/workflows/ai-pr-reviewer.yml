name: AI PR Reviewer Agent (NVIDIA Nemotron)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: get_diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.patch
          echo "diff_exists=$(test -s pr_diff.patch && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.get_diff.outputs.diff_exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Review Script
        if: steps.get_diff.outputs.diff_exists == 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          npm install openai @octokit/rest
          node -e '
          const fs = require("fs");
          const OpenAI = require("openai").default;
          const { Octokit } = require("@octokit/rest");

          async function main() {
            const diff = fs.readFileSync("pr_diff.patch", "utf8");
            if (!diff.trim()) return;

            const openai = new OpenAI({
              apiKey: process.env.NVIDIA_API_KEY,
              baseURL: "https://integrate.api.nvidia.com/v1",
            });

            const prompt = [
              "You are a senior software engineer performing a thorough Pull Request (PR) code review. Respond entirely in English, regardless of the language used in the code, comments, or commit messages.",
              "",
              "Your tasks:",
              "1. **Summary**: Provide a concise summary of the key changes introduced in this PR.",
              "2. **Issues & Bugs**: Identify potential bugs, security vulnerabilities, edge cases, or performance bottlenecks. If none are found, state that explicitly.",
              "3. **Improvements & Best Practices**: Suggest actionable recommendations on clean code, design patterns, naming conventions, and refactoring opportunities to improve maintainability.",
              "4. **Suggested PR Description**: Generate a structured PR description template with the following sections (omit or mark as N/A if the context is missing from the diff):",
              "   * **Problem**: What issue does this PR solve?",
              "   * **Solution**: How is it implemented?",
              "   * **Testing**: How should this be verified?",
              "   * **Related Issues**: Any referenced tickets or issues.",
              "",
              "Git diff content:",
              diff.substring(0, 30000)
            ].join("\n");

            console.log("Sending review request to NVIDIA API...");

            const completion = await openai.chat.completions.create({
              model: "nvidia/nemotron-3.5-lightning-30b-a3b",
              messages: [{ role: "user", content: prompt }],
              temperature: 1,
              top_p: 0.95,
              max_tokens: 16384,
              reasoning_budget: 16384,
              chat_template_kwargs: { enable_thinking: true },
              stream: true,
            });

            let fullContent = "";
            let fullReasoning = "";

            for await (const chunk of completion) {
              const reasoning = chunk.choices[0]?.delta?.reasoning_content;
              if (reasoning) {
                fullReasoning += reasoning;
              }

              const content = chunk.choices[0]?.delta?.content;
              if (content) {
                fullContent += content;
              }
            }

            let commentBody = "🤖 **AI PR Reviewer Report (NVIDIA Nemotron)**\n\n";

            if (fullReasoning.trim()) {
              commentBody += `<details>\n<summary>🧠 <b>Reasoning Process</b></summary>\n\n${fullReasoning}\n\n</details>\n\n---\n\n`;
            }

            commentBody += fullContent;

            const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
            const [owner, repo] = process.env.REPO.split("/");

            await octokit.issues.createComment({
              owner,
              repo,
              issue_number: parseInt(process.env.PR_NUMBER),
              body: commentBody,
            });

            console.log("Review comment posted successfully!");
          }

          main().catch((err) => {
            console.error("Error during PR review execution:", err);
            process.exit(1);
          });
          '